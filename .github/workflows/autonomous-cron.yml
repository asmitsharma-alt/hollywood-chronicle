name: 24/7 Autonomous Newsroom Engine Cron

on:
  schedule:
    # Runs every 15 minutes automatically 24/7
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sweep-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Hollywood Chronicle Autonomous Intelligence Sweep
        run: |
          curl -s -X POST https://hollywood-chronicle.vercel.app/api/cron/autonomous-worker
