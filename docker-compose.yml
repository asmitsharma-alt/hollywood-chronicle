services:
  hollywood-chronicle:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hollywood_chronicle_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APPWRITE_ENDPOINT=${NEXT_PUBLIC_APPWRITE_ENDPOINT}
      - NEXT_PUBLIC_APPWRITE_PROJECT_ID=${NEXT_PUBLIC_APPWRITE_PROJECT_ID}
      - APPWRITE_DATABASE_ID=${APPWRITE_DATABASE_ID}
      - APPWRITE_COLLECTION_ID=${APPWRITE_COLLECTION_ID}
      - APPWRITE_API_KEY=${APPWRITE_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - NEWS_API_KEY=${NEWS_API_KEY}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - CRON_SECRET=${CRON_SECRET}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
